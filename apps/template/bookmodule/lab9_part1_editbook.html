{% extends 'layouts/base.html' %}

{% block title %}Lab 9 Part 1 - Edit Book{% endblock %}

{% block content %}
<div class="lab9">
<h1>Edit book #{{ book.id }}</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}

<form method="post">
    {% csrf_token %}

    <p>
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ book.title }}" required>
    </p>

    <p>
        <label for="price">Price:</label>
        <input type="number" step="0.01" id="price" name="price" value="{{ book.price }}" required>
    </p>

    <p>
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" value="{{ book.quantity }}" required>
    </p>

    <p>
        <label for="pubdate">Publication date:</label>
        <input type="datetime-local" id="pubdate" name="pubdate"
               value="{{ book.pubdate|date:'Y-m-d\TH:i' }}" required>
    </p>

    <p>
        <label for="rating">Rating (1-5):</label>
        <input type="number" min="1" max="5" id="rating" name="rating" value="{{ book.rating }}" required>
    </p>

    <p>
        <label for="publisher">Publisher:</label>
        <select name="selectedgenre">

  <option selected>Value</option>

  <option value="fiction">Fiction</option>

  <option value="n-fiction">Non-fiction</option>

</select>
    </p>

    <p>
        <label for="authors">Authors:</label>
        <select id="authors" name="authors" multiple>
            {% for a in authors %}
            <option value="{{ a.id }}" {% if a.id in selected_authors %}selected{% endif %}>{{ a.name }}</option>
            {% endfor %}
        </select>
    </p>

    <p>
        <button type="submit">Save changes</button>
        <a href="{% url 'books.lab9_part1.listbooks' %}">Cancel</a>
    </p>
</form>
</div>
{% endblock %}
