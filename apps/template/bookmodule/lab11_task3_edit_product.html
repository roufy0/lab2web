{% extends 'layouts/base.html' %}

{% block title %}Lab 10 Task 3 - Edit Product{% endblock %}

{% block content %}
<h1>Edit Product: {{ product.name }}</h1>
{% if product.image %}
<p>Current image: <img src="{{ product.image.url }}" alt="{{ product.name }}" style="height:80px;"></p>
{% endif %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <p>
        <button type="submit">Save</button>
        <a href="{% url 'books.lab11.task3.list_products' %}">Cancel</a>
    </p>
</form>
{% endblock %}
