{% extends 'layouts/base.html' %}

{% block title %}Lab 9 Part 1 - Add Book{% endblock %}

{% block content %}
<div class="lab9">
<h1>Add a new book</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}

<form method="post">
    {% csrf_token %}

    <p>
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ data.title|default:'' }}" required>
    </p>

    <p>
        <label for="price">Price:</label>
        <input type="number" step="0.01" id="price" name="price" value="{{ data.price|default:'' }}" required>
    </p>

    <p>
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" value="{{ data.quantity|default:'1' }}" required>
    </p>

    <p>
        <label for="pubdate">Publication date:</label>
        <input type="datetime-local" id="pubdate" name="pubdate" value="{{ data.pubdate|default:'' }}" required>
    </p>

    <p>
        <label for="rating">Rating (1-5):</label>
        <input type="number" min="1" max="5" id="rating" name="rating" value="{{ data.rating|default:'1' }}" required>
    </p>

    <p>
        <label for="publisher">Publisher:</label>
        <select id="publisher" name="publisher">
            <option value="">-- none --</option>
            {% for p in publishers %}
            <option value="{{ p.id }}">{{ p.name }}</option>
            {% endfor %}
        </select>
    </p>

    <p>
        <label for="authors">Authors:</label>
        <select id="authors" name="authors" multiple>
            {% for a in authors %}
            <option value="{{ a.id }}">{{ a.name }}</option>
            {% endfor %}
        </select>
    </p>

    <p>
        <button type="submit">Save book</button>
        <a href="{% url 'books.lab9_part1.listbooks' %}">Cancel</a>
    </p>
</form>
</div>
{% endblock %}
